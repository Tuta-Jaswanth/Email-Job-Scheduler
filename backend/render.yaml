# Render Blueprint Specification for ReachInbox
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── ReachInbox Web & Scheduler Service ────────────────────────────────────
  - type: web
    name: reachinbox-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: MIN_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 200
      - key: WORKER_CONCURRENCY
        value: 10

# ── Render PostgreSQL Database ───────────────────────────────────────────────
databases:
  - name: reachinbox-db
    databaseName: reachinbox
    user: reachinbox_user
    plan: free
    region: oregon
